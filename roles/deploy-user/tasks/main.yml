---
- name: Create dedicated system user
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Ensure app directory exists
  ansible.builtin.file:
    path: "{{ deploy_home }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0755"
