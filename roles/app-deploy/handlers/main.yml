---
- name: restart app service
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
    daemon_reload: true
  loop: "{{ [app_service_name] if app_service_name is string else app_service_name }}"
  register: app_restart
  # The first deploy comes before the services exist (role systemd-service): nothing to restart.
  failed_when: app_restart.failed and 'Could not find the requested service' not in (app_restart.msg | default(''))
